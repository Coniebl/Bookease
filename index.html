<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookEase - Login</title>
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./supabaseClient.js"></script>
  <script defer src="./script.js"></script>
</head>

<body class="page-login">
  <header>
    <div id="header-left-side">
      <img src="./assets/logo.png" alt="Logo" />
      <h1 class="headertitle">BookEase</h1>
    </div>

    <nav id="icons">
      <a href="./home.html" class="nav-link">Home</a>
      <a href="./services.html" class="nav-link">Services</a>
      <a href="./contact.html" class="nav-link">Contact</a>
      <a href="./my_bookings.html" class="nav-link">My Bookings</a>
    </nav>
  </header>

  <main id="login-section">
    <div id="content-wrapper">
      <div id="tagline">
        <h2>Book Smart,</h2>
        <h2>Stay Easy.</h2>
        <h1>ONLY WITH BOOKEASE!</h1>
      </div>

      <div class="form-box active" id="login-box">
        <h2>Login</h2>
        <p class="error-message" id="login-message" style="display: none;"></p>
        <form id="login-form">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="Enter your email" required>
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
          <button type="submit" name="login">Login</button>
        </form>
        <p class="signup-text">Don’t have an account? <a href="#" onclick="showForm('signup-box'); return false;">Sign up</a></p>
      </div>

      <div class="form-box" id="signup-box">
        <h2>Sign Up</h2>
        <p class="error-message" id="signup-message" style="display: none;"></p>
        <form id="signup-form">
          <div class="name-row">
            <div class="field-group">
              <label for="signup-first-name">First Name</label>
              <input type="text" id="signup-first-name" name="first_name" placeholder="First name" required>
            </div>
            <div class="field-group">
              <label for="signup-last-name">Last Name</label>
              <input type="text" id="signup-last-name" name="last_name" placeholder="Last name" required>
            </div>
          </div>
          <div class="field-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" name="email" placeholder="Enter your email" required>
          </div>
          <div class="field-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" placeholder="Enter your password (min. 6 chars)" minlength="6" required>
          </div>
          <button type="submit" name="signup">Sign Up</button>
        </form>
        <p class="signup-text">Already have an account? <a href="#" onclick="showForm('login-box'); return false;">Login</a></p>
      </div>
    </div>
  </main>

  <footer>© 2025 BookEase | All Rights Reserved</footer>
</body>

</html>
